name: Financial news brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  build-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python news_agent/financebot.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERVER_CHAN_KEYS: ${{ secrets.SERVER_CHAN_KEYS }}
          OPENAI_BASE_URL: https://api.deepseek.com/v1
          OPENAI_MODEL: deepseek-chat
